services:
  - type: web
    name: ecommerce-multiagent-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENV
        value: production
      - key: USE_SQLITE
        value: "true"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
